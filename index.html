<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заказ выпечки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f0; --card:#ffffff; --ink:#1d2a23; --mute:#6f7d74; --line:#dfe6dc;
  --acc:#2c6a4d; --acc-ink:#ffffff; --soft:#e2ede5; --danger:#b6382b; --warn:#f0e4c4; --warn-ink:#5b4713;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141b17; --card:#1e2823; --ink:#eaf1ec; --mute:#98a89e; --line:#2c3a33;
    --acc:#5fbf8f; --acc-ink:#0f1a14; --soft:#243a2e; --danger:#ef7b6d; --warn:#3a3218; --warn-ink:#e9d99b;
  }
}
:root[data-theme="dark"]{
  --bg:#141b17; --card:#1e2823; --ink:#eaf1ec; --mute:#98a89e; --line:#2c3a33;
  --acc:#5fbf8f; --acc-ink:#0f1a14; --soft:#243a2e; --danger:#ef7b6d; --warn:#3a3218; --warn-ink:#e9d99b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 120px}
h1{font-size:24px;line-height:1.15;margin:4px 0 12px;font-weight:700;letter-spacing:-.01em}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:13px;color:var(--mute);margin:0 0 4px 2px}
.field input,.field textarea{width:100%;height:48px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;outline:none}
.field textarea{height:76px;padding:10px 14px;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:14px;margin:2px 0 14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{height:46px;border-radius:11px;font-weight:600;font-size:16px;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:8px}
.item .info{flex:1;min-width:0}
.item .name{font-weight:600;font-size:16px}
.item .desc{font-size:13px;color:var(--mute);margin-top:1px}
.price{font-weight:700;font-size:15px;color:var(--acc);margin-top:2px}
.price small{font-weight:500;color:var(--mute);font-size:13px}
.price.none{color:var(--mute);font-weight:500}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:44px;height:44px;border-radius:12px;background:var(--soft);font-size:24px;font-weight:600;line-height:1;display:grid;place-items:center}
.step button.plus{background:var(--acc);color:var(--acc-ink)}
.step button:active{transform:scale(.94)}
.step .q{width:52px;height:44px;border:0;background:transparent;text-align:center;font-weight:700;font-size:17px;-moz-appearance:textfield;appearance:textfield;padding:0;border-radius:10px}
.step .q::-webkit-outer-spin-button,.step .q::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step .q:focus{background:var(--soft);outline:none}
.clear{display:block;width:100%;height:44px;margin-top:8px;border-radius:12px;color:var(--mute);font-weight:600}
.clear.sure{color:var(--danger);border:1.5px solid var(--danger)}
.step .q.zero{color:var(--mute);font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:10}
.bar button,.big{display:flex;align-items:center;justify-content:center;width:100%;max-width:480px;margin:0 auto;height:56px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.bar button[disabled],.big[disabled]{background:var(--line);color:var(--mute);box-shadow:none}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sheet-h h2{margin:0;font-size:20px}
.x{width:44px;height:44px;border-radius:12px;background:var(--soft);font-size:22px}
.sheet-b{overflow:auto;padding:4px 14px 8px;flex:1}
.sheet-f{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.crow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.crow .info{flex:1;min-width:0}
.crow .sum{font-size:14px;color:var(--mute);margin-top:2px}
.crow .sum b{color:var(--ink)}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:2px 4px 12px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:40;font-size:15px;max-width:90%;text-align:center}
.fallback{width:100%;height:150px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px;margin-bottom:10px;font-size:14px}
.hint{font-size:13px;color:var(--mute);margin:0 2px 8px}
/* admin */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mini{height:44px;padding:0 16px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.mini.ghost{background:var(--soft);color:var(--ink)}
.arow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;margin-bottom:8px}
.arow.off{opacity:.55}
.arow .edit{flex:1;min-width:0;text-align:left;padding:8px 0}
.arow .name{font-weight:600}
.arow .sub{font-size:13px;color:var(--mute)}
.sw{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-pressed="true"]{background:var(--acc)}
.sw[aria-pressed="true"]::after{left:24px}
.h3{font-size:14px;color:var(--mute);margin:14px 2px 8px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{height:46px;border-radius:12px;background:var(--soft);font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.chips button{height:36px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:500}
.danger{background:none;color:var(--danger);font-weight:600;height:48px;width:100%;border-radius:12px;border:1.5px solid var(--danger);margin-top:10px}
.danger.sure{background:var(--danger);color:#fff}
.status{font-size:14px;text-align:center;margin:0 0 8px}
.status.err{color:var(--danger)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script id="catalog-data" type="application/json">{"updated": "2026-09-23", "items": [{"id": "b1", "name": "Круассан классика", "cat": "bakery", "price": 590, "unit": "шт.", "desc": "и", "on": true}, {"id": "b2", "name": "Круассан миндальный", "cat": "bakery", "price": 920, "unit": "шт.", "desc": "", "on": true}, {"id": "b3", "name": "Круассан фисташка", "cat": "bakery", "price": 850, "unit": "шт.", "desc": "", "on": true}, {"id": "b4", "name": "Круассан с сыром", "cat": "bakery", "price": 890, "unit": "шт.", "desc": "", "on": true}, {"id": "b5", "name": "Круассан со сгущенкой", "cat": "bakery", "price": 650, "unit": "шт.", "desc": "", "on": true}, {"id": "b6", "name": "Круассан с шоколадом", "cat": "bakery", "price": 650, "unit": "шт.", "desc": "", "on": true}, {"id": "b7", "name": "Круассан для сэндвичей", "cat": "bakery", "price": 590, "unit": "шт.", "desc": "", "on": true}, {"id": "b8", "name": "Мак булочка", "cat": "bakery", "price": 200, "unit": "шт.", "desc": "", "on": true}, {"id": "b9", "name": "Сырники", "cat": "bakery", "price": 16000, "unit": "кор.", "desc": "50 шт. в коробке", "on": true}, {"id": "b10", "name": "Гранола", "cat": "bakery", "price": 2000, "unit": "уп.", "desc": "250 г", "on": true}, {"id": "d1", "name": "Вупи пай", "cat": "dessert", "price": 690, "unit": "шт.", "desc": "", "on": true}, {"id": "d2", "name": "Фисташковый рулет", "cat": "dessert", "price": 890, "unit": "шт.", "desc": "", "on": true}, {"id": "d3", "name": "Молочная девочка", "cat": "dessert", "price": 590, "unit": "шт.", "desc": "", "on": true}, {"id": "d4", "name": "Медовик", "cat": "dessert", "price": 590, "unit": "шт.", "desc": "", "on": true}, {"id": "d5", "name": "Испанский чизкейк", "cat": "dessert", "price": 690, "unit": "шт.", "desc": "", "on": true}, {"id": "d6", "name": "Казакша чизкейк", "cat": "dessert", "price": 790, "unit": "шт.", "desc": "", "on": true}, {"id": "d7", "name": "Картошка пирожное", "cat": "dessert", "price": 590, "unit": "шт.", "desc": "", "on": true}, {"id": "d8", "name": "Шоколадный брауни", "cat": "dessert", "price": 750, "unit": "шт.", "desc": "", "on": true}, {"id": "d9", "name": "Мини брауни в стаканчике", "cat": "dessert", "price": 890, "unit": "шт.", "desc": "", "on": true}, {"id": "d10", "name": "Кукис фисташка", "cat": "dessert", "price": 500, "unit": "шт.", "desc": "", "on": true}, {"id": "d11", "name": "Кукис брауни", "cat": "dessert", "price": 500, "unit": "шт.", "desc": "", "on": true}, {"id": "d12", "name": "Кукис красный бархат", "cat": "dessert", "price": 500, "unit": "шт.", "desc": "", "on": true}, {"id": "d13", "name": "Кукис классический", "cat": "dessert", "price": 500, "unit": "шт.", "desc": "", "on": true}, {"id": "d14", "name": "Брауни комплимент", "cat": "dessert", "price": null, "unit": "порц.", "desc": "", "on": true}, {"id": "d15", "name": "Тарталетка клубника", "cat": "dessert", "price": 400, "unit": "шт.", "desc": "", "on": true}, {"id": "d16", "name": "Тарталетка малина", "cat": "dessert", "price": 400, "unit": "шт.", "desc": "", "on": true}, {"id": "d17", "name": "Тарталетка банофи", "cat": "dessert", "price": 400, "unit": "шт.", "desc": "", "on": true}, {"id": "b11", "name": "Паштел-де-ната", "cat": "bakery", "price": 260, "unit": "шт.", "desc": "", "on": true}]}</script>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var catalog=JSON.parse(document.getElementById('catalog-data').textContent);
var CATS={bakery:'Выпечка',dessert:'Десерты'};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(n,sp){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,sp||'\u00a0');}
function money(n,sp){return num(n,sp)+(sp?' ':'\u00a0')+'₸';}
function plural(n,a,b,c){var m=n%10,h=n%100;if(m===1&&h!==11)return a;if(m>=2&&m<=4&&(h<12||h>14))return b;return c;}
function store(k,v){try{if(v===undefined){return localStorage.getItem(k);}localStorage.setItem(k,v);}catch(e){}return null;}
function stamp(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function stampText(){return catalog.updated?'Цены обновлены: '+String(catalog.updated).split('-').reverse().join('.'):'';}
var toastT;
function toast(t){
  var old=app.querySelector('.toast');if(old)old.remove();
  var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;app.appendChild(d);
  clearTimeout(toastT);toastT=setTimeout(function(){d.remove();},2500);
}
function isAdmin(){return /^#\/?admin/i.test(location.hash)||store('mode')==='admin';}
var mode=isAdmin()?'admin':'shop',taps=0,tapT;

/* ---------- customer view ---------- */
var qty={};try{qty=JSON.parse(store('qty')||'{}')||{};}catch(e){qty={};}
var shop=store('shop')||'',staff=store('staff')||'';
var tab='bakery',cartOpen=false,copyFail='',clearAsk=false,comment='';

function activeItems(){return catalog.items.filter(function(i){return i.on;});}
function cartLines(){
  var lines=[];
  ['bakery','dessert'].forEach(function(c){
    catalog.items.forEach(function(i){if(i.on&&i.cat===c&&qty[i.id]>0)lines.push({it:i,q:qty[i.id]});});
  });
  return lines;
}
function total(lines){return lines.reduce(function(s,l){return s+(l.it.price!=null?l.it.price*l.q:0);},0);}
function stepper(id){
  var q=qty[id]||0;
  return '<div class="step"><button data-act="dec" data-id="'+esc(id)+'" aria-label="Меньше">−</button><input class="q'+(q?'':' zero')+'" type="number" inputmode="numeric" min="0" max="9999" value="'+q+'" data-q="'+esc(id)+'" aria-label="Количество"><button class="plus" data-act="inc" data-id="'+esc(id)+'" aria-label="Больше">+</button></div>';
}
function priceHtml(it){
  return it.price!=null?'<div class="price">'+money(it.price)+' <small>/ '+esc(it.unit)+'</small></div>':'<div class="price none">Цена не указана · '+esc(it.unit)+'</div>';
}
function renderCustomerShell(){
  app.innerHTML='<div class="wrap">'+
    '<h1 data-act="title">Заказ выпечки</h1>'+
    '<label class="field"><span>Кофейня</span><input id="shop" type="text" autocomplete="off" placeholder="Например, Coffee Expert" value="'+esc(shop)+'"></label>'+
    '<label class="field"><span>Сотрудник</span><input id="staff" type="text" autocomplete="off" placeholder="Ваше имя" value="'+esc(staff)+'"></label>'+
    '<div class="note">Минимальный заказ — 10&nbsp;000&nbsp;₸</div>'+
    '<div class="tabs" role="tablist"><button class="tab" role="tab" data-act="tab" data-id="bakery">Выпечка</button><button class="tab" role="tab" data-act="tab" data-id="dessert">Десерты</button></div>'+
    '<div id="list"></div><div class="hint" style="text-align:center;margin:14px 0 0">'+stampText()+'</div></div>'+
    '<div class="bar" id="bar"></div><div id="sheet"></div>';
  renderList();renderBar();renderSheet();
}
function renderList(){
  var el=document.getElementById('list');if(!el)return;
  Array.prototype.forEach.call(app.querySelectorAll('.tab'),function(b){
    var c=b.getAttribute('data-id');
    var n=activeItems().filter(function(i){return i.cat===c&&qty[i.id]>0;}).length;
    b.textContent=CATS[c]+(n?' · '+n:'');
    b.setAttribute('aria-selected',c===tab?'true':'false');
  });
  var items=activeItems().filter(function(i){return i.cat===tab;});
  if(!items.length){el.innerHTML='<div class="empty">В этой категории пока нет товаров</div>';return;}
  el.innerHTML=items.map(function(i){
    return '<div class="item"><div class="info"><div class="name">'+esc(i.name)+'</div>'+(i.desc?'<div class="desc">'+esc(i.desc)+'</div>':'')+priceHtml(i)+'</div>'+stepper(i.id)+'</div>';
  }).join('');
}
function renderBar(){
  var el=document.getElementById('bar');if(!el)return;
  var lines=cartLines(),n=lines.length;
  if(!n){el.innerHTML='<button disabled>Заказ пуст</button>';return;}
  el.innerHTML='<button data-act="open">Заказ · '+n+' '+plural(n,'позиция','позиции','позиций')+' · '+money(total(lines))+'</button>';
}
function renderSheet(){
  var el=document.getElementById('sheet');if(!el)return;
  if(!cartOpen){el.innerHTML='';return;}
  var lines=cartLines();
  var body=lines.length?lines.map(function(l){
    var it=l.it;
    var sum=it.price!=null?'<b>'+money(it.price*l.q)+'</b> · '+l.q+' '+esc(it.unit)+' × '+money(it.price):l.q+' '+esc(it.unit)+' · цена не указана';
    return '<div class="crow"><div class="info"><div class="name">'+esc(it.name)+'</div><div class="sum">'+sum+'</div></div>'+stepper(it.id)+'</div>';
  }).join(''):'<div class="empty">Корзина пуста</div>';
  el.innerHTML='<div class="sheet-bg" data-act="closebg"><div class="sheet" role="dialog" aria-label="Корзина">'+
    '<div class="sheet-h"><h2>Ваш заказ</h2><button class="x" data-act="close" aria-label="Закрыть">×</button></div>'+
    '<div class="sheet-b">'+body+(lines.length?'<label class="field" style="margin-top:6px"><span>Комментарий (необязательно)</span><input id="comment" type="text" autocomplete="off" placeholder="Например, привезти к 9:00" value="'+esc(comment)+'"></label>':'')+'</div>'+
    '<div class="sheet-f">'+
      '<div class="total"><span>Итого:</span><span>'+money(total(lines))+'</span></div>'+
      (copyFail?'<p class="hint">Не удалось скопировать автоматически. Выделите текст ниже и скопируйте вручную.</p><textarea class="fallback" id="fb" readonly>'+esc(copyFail)+'</textarea>':'')+
      '<button class="big" data-act="copy"'+(lines.length?'':' disabled')+'>Скопировать заказ</button>'+
      (lines.length?'<button class="clear'+(clearAsk?' sure':'')+'" data-act="clear">'+(clearAsk?'Нажмите ещё раз, чтобы очистить':'Очистить заказ')+'</button>':'')+
    '</div></div></div>';
  if(copyFail){var fb=document.getElementById('fb');if(fb){fb.focus();fb.select();}}
}
function buildText(){
  var lines=cartLines();
  var out=['Кофейня: '+(shop.trim()||'—'),'Сотрудник: '+(staff.trim()||'—'),'','Заказ:',''];
  lines.forEach(function(l,idx){
    var it=l.it;
    if(it.price!=null)out.push((idx+1)+'. '+it.name+' — '+l.q+' '+it.unit+' × '+money(it.price,' ')+' = '+money(it.price*l.q,' '));
    else out.push((idx+1)+'. '+it.name+' — '+l.q+' '+it.unit);
  });
  out.push('','Итого: '+money(total(lines),' '));
  if(comment.trim())out.push('','Комментарий: '+comment.trim());
  return out.join('\n');
}
function copyText(t){
  return new Promise(function(resolve){
    function legacy(){
      try{
        var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
        ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
        document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
        var ok=document.execCommand('copy');ta.remove();resolve(!!ok);
      }catch(e){resolve(false);}
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){resolve(true);},legacy);return;
      }
    }catch(e){}
    legacy();
  });
}
function saveQty(){store('qty',JSON.stringify(qty));}
function change(id,d){
  var it=catalog.items.filter(function(i){return i.id===id;})[0];if(!it)return;
  var q=Math.max(0,(qty[id]||0)+d);
  if(q)qty[id]=q;else delete qty[id];
  clearAsk=false;saveQty();renderList();renderBar();if(cartOpen){
    var sb=app.querySelector('.sheet-b');var st=sb?sb.scrollTop:0;
    renderSheet();var sb2=app.querySelector('.sheet-b');if(sb2)sb2.scrollTop=st;
  }
}

/* ---------- admin view ---------- */
var adm=null,dirty=false,edit=null,confirmDel=false,pubMsg='',pubErr=false;
function newId(){return 'n'+Date.now().toString(36)+Math.floor(Math.random()*1000);}
function renderAdmin(){
  if(!adm){adm={items:JSON.parse(JSON.stringify(catalog.items))};}
  var html='<div class="wrap"><div class="top"><h1>Каталог товаров</h1><button class="mini ghost" data-act="tocustomer">К заказу</button></div>'+
    '<button class="big" style="box-shadow:none;margin-bottom:6px" data-act="new">+ Добавить товар</button>';
  ['bakery','dessert'].forEach(function(c){
    html+='<div class="h3">'+CATS[c]+'</div>';
    var list=adm.items.filter(function(i){return i.cat===c;});
    if(!list.length)html+='<div class="empty">Нет товаров</div>';
    list.forEach(function(i){
      html+='<div class="arow'+(i.on?'':' off')+'"><button class="edit" data-act="edit" data-id="'+esc(i.id)+'"><div class="name">'+esc(i.name)+'</div><div class="sub">'+(i.price!=null?money(i.price)+' / '+esc(i.unit):'Цена не указана · '+esc(i.unit))+(i.on?'':' · отключён')+'</div></button>'+
        '<button class="sw" data-act="toggle" data-id="'+esc(i.id)+'" aria-pressed="'+(i.on?'true':'false')+'" aria-label="Показывать товар"></button></div>';
    });
  });
  html+='</div>';
  html+='<div class="bar">'+(pubMsg?'<p class="status'+(pubErr?' err':'')+'">'+esc(pubMsg)+'</p>':'')+
    '<button data-act="publish"'+(dirty?'':' disabled')+'>'+(dirty?'Скачать catalog.json':'Нет изменений')+'</button></div>'+
    '<div id="sheet"></div>';
  app.innerHTML=html;
  renderEditor();
}
function renderEditor(){
  var el=document.getElementById('sheet');if(!el||!edit)return;
  var d=edit.draft;
  el.innerHTML='<div class="sheet-bg" data-act="editbg"><div class="sheet" role="dialog" aria-label="Товар">'+
    '<div class="sheet-h"><h2>'+(edit.id?'Изменить товар':'Новый товар')+'</h2><button class="x" data-act="editclose" aria-label="Закрыть">×</button></div>'+
    '<div class="sheet-b">'+
      '<label class="field"><span>Название</span><input type="text" data-bind="name" value="'+esc(d.name)+'" autocomplete="off"></label>'+
      '<div class="seg"><button data-act="setcat" data-id="bakery" aria-pressed="'+(d.cat==='bakery')+'">Выпечка</button><button data-act="setcat" data-id="dessert" aria-pressed="'+(d.cat==='dessert')+'">Десерты</button></div>'+
      '<div class="row2"><label class="field"><span>Цена, ₸</span><input type="number" inputmode="numeric" min="0" data-bind="price" value="'+(d.price==null?'':d.price)+'" placeholder="не указана"></label>'+
      '<label class="field"><span>Единица</span><input type="text" data-bind="unit" value="'+esc(d.unit)+'" autocomplete="off"></label></div>'+
      '<div class="chips" style="margin:-2px 0 12px">'+['шт.','кор.','уп.','порц.','кг'].map(function(u){return '<button data-act="setunit" data-id="'+u+'">'+u+'</button>';}).join('')+'</div>'+
      '<label class="field"><span>Описание (необязательно)</span><textarea data-bind="desc">'+esc(d.desc)+'</textarea></label>'+
      (edit.id?'<button class="danger'+(confirmDel?' sure':'')+'" data-act="del">'+(confirmDel?'Нажмите ещё раз, чтобы удалить':'Удалить товар')+'</button>':'')+
    '</div>'+
    '<div class="sheet-f"><button class="big" data-act="editdone" style="box-shadow:none">Готово</button></div></div></div>';
}
function publish(){
  var data={updated:stamp(),items:adm.items.map(function(i){return {id:i.id,name:i.name,cat:i.cat,price:i.price,unit:i.unit,desc:i.desc,on:i.on};})};
  var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catalog.json';document.body.appendChild(a);a.click();a.remove();
  catalog=data;dirty=false;pubMsg='Файл catalog.json скачан. Загрузите его на хостинг вместо старого.';pubErr=false;
  renderAdmin();
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'),id=t.getAttribute('data-id');
  if(act==='closebg'){if(e.target===t){cartOpen=false;copyFail='';renderSheet();}return;}
  if(act==='editbg'){if(e.target===t){edit=null;confirmDel=false;renderAdmin();}return;}
  switch(act){
    case 'inc':change(id,1);break;
    case 'dec':change(id,-1);break;
    case 'tab':tab=id;renderList();break;
    case 'open':cartOpen=true;copyFail='';clearAsk=false;renderSheet();break;
    case 'close':cartOpen=false;copyFail='';clearAsk=false;renderSheet();break;
    case 'clear':
      if(!clearAsk){clearAsk=true;renderSheet();}
      else{qty={};comment='';saveQty();clearAsk=false;cartOpen=false;renderList();renderBar();renderSheet();toast('Заказ очищен');}
      break;
    case 'copy':
      var txt=buildText();
      copyText(txt).then(function(ok){
        if(ok){copyFail='';toast('Заказ скопирован');renderSheet();}
        else{copyFail=txt;renderSheet();}
      });break;
    case 'tocustomer':mode='shop';store('mode','shop');if(location.hash)location.hash='';route();break;
    case 'title':taps++;clearTimeout(tapT);tapT=setTimeout(function(){taps=0;},2000);if(taps>=5){taps=0;mode='admin';store('mode','admin');route();}break;
    /* admin */
    case 'new':edit={id:null,draft:{name:'',cat:'bakery',price:null,unit:'шт.',desc:'',on:true}};confirmDel=false;renderAdmin();break;
    case 'edit':
      var it=adm.items.filter(function(i){return i.id===id;})[0];
      if(it){edit={id:id,draft:JSON.parse(JSON.stringify(it))};confirmDel=false;renderAdmin();}break;
    case 'toggle':
      adm.items.forEach(function(i){if(i.id===id)i.on=!i.on;});dirty=true;pubMsg='';renderAdmin();break;
    case 'setcat':edit.draft.cat=id;renderEditor();break;
    case 'setunit':edit.draft.unit=id;renderEditor();break;
    case 'editclose':edit=null;confirmDel=false;renderAdmin();break;
    case 'editdone':
      var d=edit.draft;d.name=d.name.trim();d.unit=d.unit.trim()||'шт.';
      if(!d.name){toast('Введите название');break;}
      if(edit.id){adm.items=adm.items.map(function(i){return i.id===edit.id?Object.assign({},d,{id:edit.id}):i;});}
      else{d.id=newId();adm.items.push(d);}
      /* keep catalog order grouped by category */
      adm.items=adm.items.filter(function(i){return i.cat==='bakery';}).concat(adm.items.filter(function(i){return i.cat==='dessert';}));
      dirty=true;pubMsg='';edit=null;confirmDel=false;renderAdmin();break;
    case 'del':
      if(!confirmDel){confirmDel=true;renderEditor();break;}
      adm.items=adm.items.filter(function(i){return i.id!==edit.id;});
      dirty=true;pubMsg='';edit=null;confirmDel=false;renderAdmin();break;
    case 'publish':publish();break;
  }
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='shop'){shop=t.value;store('shop',shop);return;}
  if(t.id==='staff'){staff=t.value;store('staff',staff);return;}
  if(t.id==='comment'){comment=t.value;return;}
  var b=t.getAttribute&&t.getAttribute('data-bind');
  if(b&&edit){
    if(b==='price'){var v=t.value.trim();edit.draft.price=v===''?null:Math.max(0,Math.round(Number(v)));if(isNaN(edit.draft.price))edit.draft.price=null;}
    else edit.draft[b]=t.value;
  }
});

app.addEventListener('change',function(e){
  var t=e.target,id=t.getAttribute&&t.getAttribute('data-q');
  if(!id)return;
  var v=Math.min(9999,Math.max(0,parseInt(t.value,10)||0));
  change(id,v-(qty[id]||0));
});

/* ---------- boot ---------- */
function route(){
  if(mode==='admin'){adm=null;dirty=false;edit=null;pubMsg='';renderAdmin();}
  else{
    /* drop stale quantities for items that no longer exist */
    var ids={};catalog.items.forEach(function(i){ids[i.id]=1;});
    Object.keys(qty).forEach(function(k){if(!ids[k])delete qty[k];});
    renderCustomerShell();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',function(){mode=/^#\/?admin/i.test(location.hash)?'admin':'shop';store('mode',mode);route();});
fetch('catalog.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d&&d.items&&d.items.length)catalog=d;}).catch(function(){}).then(route);
})();
</script>
</body>
</html>
